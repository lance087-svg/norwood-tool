<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Activity — Norwood Supply</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f0ece4;color:#111827;font-size:15px}
.header{background:#1a2438;padding:10px 20px;border-bottom:3px solid #2980d4;position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{font-size:20px;font-weight:700;color:#fff}.logo span{color:#2980d4}
.tagline{font-size:11px;color:#9baab8;letter-spacing:1px;text-transform:uppercase}
.hctl{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:flex;background:#0f1726;border-radius:6px;overflow:hidden;border:1px solid #2f3d55}
.seg button{background:transparent;color:#a89060;border:none;padding:7px 13px;font-weight:600;font-size:13px;cursor:pointer}
.seg button.on{background:#2980d4;color:#fff}
select,input[type=text],input[type=date],textarea{padding:7px 10px;border-radius:5px;border:1.5px solid #d5c8a8;background:#faf8f4;font-size:13px;color:#2c2416;font-family:inherit;outline:none}
.header select{background:#0f1726;color:#f5e8c8;border-color:#2f3d55}
.btn{padding:8px 14px;border-radius:5px;border:none;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
.btn-p{background:#2980d4;color:#fff}.btn-p:hover{background:#1a6ab5}
.btn-g{background:#2d6a30;color:#fff}
.btn-gh{background:transparent;color:#6b5a3a;border:1px solid #d5c8a8}.btn-gh:hover{background:#faf8f4}
.btn-w{background:#fff;color:#1a2438;border:1px solid #c9d3e0}
.main{padding:18px 20px 60px;max-width:1150px;margin:0 auto}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid #e0d5c0;border-radius:8px;padding:10px 12px}
.kpi .n{font-size:22px;font-weight:700;color:#1a2438;line-height:1.1}
.kpi .l{font-size:11px;color:#6b5a3a;text-transform:uppercase;letter-spacing:.5px;margin-top:2px}
.kpi.money .n{color:#2d6a30}
.panel{background:#fff;border-radius:8px;border:1px solid #e0d5c0;overflow:hidden;margin-bottom:16px}
.ph{background:#1a2438;color:#fff;padding:11px 16px;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.ph small{font-size:11px;color:#a89060;font-weight:400}
.ph.red{background:#8f2a20}
.pb{padding:12px 16px}
.act{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid #f0e8d8}
.act:last-child{border-bottom:none}
.act .tag{flex-shrink:0;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:3px 8px;border-radius:10px;margin-top:2px;white-space:nowrap}
.tag.quote{background:#eaf4fd;color:#1a6ab5}.tag.vendor{background:#f5eeff;color:#7b3fa0}.tag.reply{background:#fdf0d0;color:#8B6914}.tag.owing{background:#fcebeb;color:#c04040}.tag.deposit{background:#fff3e0;color:#b35309}
.act .body{flex:1;min-width:0}
.act .t{font-weight:700;color:#1a2438;font-size:14px}
.act .s{font-size:12.5px;color:#4a3a20;margin-top:2px;line-height:1.4}
.act .age{font-size:11px;color:#a89060;margin-left:6px;font-weight:400}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.acts a,.acts button{font-size:11px;font-weight:600;padding:4px 9px;border-radius:5px;border:1px solid #c9d3e0;background:#fff;color:#1a2438;text-decoration:none;cursor:pointer;font-family:inherit}
.acts a:hover,.acts button:hover{background:#eaf4fd;border-color:#2980d4}
.acts .done{color:#2d6a30;border-color:#bcd8bf}
.nsect{border-bottom:1px solid #f0e8d8;padding-bottom:4px;margin-bottom:6px}
.nsect:last-child{border-bottom:none}
.nsect>summary{list-style:none;cursor:pointer;font-weight:700;color:#1a2438;font-size:13.5px;padding:8px 0;display:flex;align-items:center;gap:8px}
.nsect>summary::-webkit-details-marker{display:none}
.nsect>summary::before{content:'▸';color:#a89060;font-size:12px}
.nsect[open]>summary::before{content:'▾'}
.nsect .cnt{background:#8f2a20;color:#fff;border-radius:10px;padding:1px 8px;font-size:11px}
.nsect .act{margin-left:18px}
.filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.pill{padding:5px 12px;border-radius:20px;font-size:11.5px;font-weight:600;cursor:pointer;border:1.5px solid #d5c8a8;background:#fff;color:#6b5a3a}
.pill.on{background:#2c2416;color:#f5e8c8;border-color:#2c2416}
.filters input{flex:1;min-width:160px}
.grp{border:1px solid #e0d5c0;border-radius:8px;background:#fff;margin-bottom:10px;overflow:hidden}
.grp>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:10px 14px;background:#fdf9f3}
.grp>summary::-webkit-details-marker{display:none}
.grp[open]>summary{border-bottom:1px solid #f0e8d8}
.who{font-weight:700;color:#1a2438;font-size:15px}
.who small{font-weight:400;color:#6b5a3a;font-size:12px;margin-left:6px}
.chips{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
.chip{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:10px;background:#f5f0e8;color:#4a3a20}
.chip.email{background:#eaf4fd;color:#1a6ab5}.chip.text{background:#eaf3de;color:#2d6a30}.chip.marketplace{background:#e8f0fe;color:#1a56b3}.chip.tool{background:#fdf0d0;color:#8B6914}.chip.vendor{background:#f5eeff;color:#7b3fa0}.chip.call{background:#fff3e0;color:#b35309}.chip.note{background:#f0e8d8;color:#4a3a20}
.chip.alert{background:#fcebeb;color:#c04040}
.ev{display:flex;gap:10px;padding:9px 14px;border-bottom:1px solid #f7f2ea;align-items:flex-start}
.ev:last-child{border-bottom:none}
.ev .ic{width:26px;text-align:center;font-size:16px;flex-shrink:0;line-height:1.2}
.ev .time{width:88px;flex-shrink:0;font-size:11px;color:#a89060;padding-top:3px}
.ev .txt{flex:1;min-width:0;font-size:13px;line-height:1.4}
.ev .txt b{color:#1a2438}
.ev .txt .sub{color:#6b5a3a;font-size:12px}
.ev .dir{font-size:10px;font-weight:700;padding:1px 6px;border-radius:8px;margin-right:4px;vertical-align:middle}
.dir.in{background:#eaf3de;color:#2d6a30}.dir.out{background:#eaf4fd;color:#1a6ab5}
.ev .lnk{font-size:11px;margin-left:6px;color:#2980d4;text-decoration:none;font-weight:600}
.ev.needs{background:#fffbf0}
.empty{text-align:center;padding:28px;color:#a89060;font-size:13px}
.daybar{font-size:11px;font-weight:700;color:#6b5a3a;text-transform:uppercase;letter-spacing:.6px;margin:14px 0 6px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1a2438;color:#fff;padding:10px 16px;border-radius:6px;font-size:13px;z-index:99;display:none;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:80;padding:16px}
.modal.on{display:flex}
.mbox{background:#fff;border-radius:10px;width:100%;max-width:440px;overflow:hidden}
.mbox .pb{display:flex;flex-direction:column;gap:8px}
.mbox label{font-size:11px;font-weight:700;color:#6b4f0a;text-transform:uppercase;letter-spacing:.5px}
.mrow{display:flex;gap:8px}
.mrow>*{flex:1}
textarea{min-height:70px;resize:vertical}
.sync{font-size:11px;color:#9baab8}
@media(max-width:640px){.main{padding:12px 12px 60px}.ev .time{width:64px}.header{padding:8px 12px}.hctl{margin-left:0;width:100%}.chips{display:none}.kpi .n{font-size:18px}}
@media print{.header,.filters,.acts,.btn{display:none!important}.main{padding:0}.grp{break-inside:avoid}}
</style>
</head>
<body>
<div class="header">
  <div>
    <div class="logo">Norwood <span>Supply</span></div>
    <div class="tagline">Activity · emails · texts · orders</div>
  </div>
  <div class="hctl">
    <div class="seg" id="range">
      <button data-r="today" class="on">Today</button>
      <button data-r="yesterday">Yesterday</button>
      <button data-r="week">This Week</button>
      <button data-r="7d">Last 7 days</button>
    </div>
    <select id="who"><option value="">Acting as…</option><option>Phil</option><option>Garon</option><option>Cleve</option><option>Lance</option></select>
    <button class="btn btn-g" onclick="openLog()">＋ Log call / note</button>
    <button class="btn btn-w" onclick="load()">↻ Refresh</button>
    <a class="btn btn-w" href="index.html" style="text-decoration:none">← Tool</a>
  </div>
</div>

<div class="main">
  <div class="kpis" id="kpis"></div>

  <div class="panel" id="needs-panel">
    <div class="ph red">⚠️ Needs action <small id="needs-count"></small></div>
    <div class="pb" id="needs"><div class="empty">Loading…</div></div>
  </div>

  <div class="filters">
    <span class="pill on" data-f="all">All</span>
    <span class="pill" data-f="email">✉️ Email</span>
    <span class="pill" data-f="text">💬 Texts</span>
    <span class="pill" data-f="marketplace">🛒 Marketplace</span>
    <span class="pill" data-f="tool">🧾 Quotes & money</span>
    <span class="pill" data-f="vendor">🏭 Vendors</span>
    <span class="pill" data-f="call">📞 Calls / notes</span>
    <input type="text" id="search" placeholder="Search name, invoice, phone…">
  </div>

  <div id="timeline"><div class="empty">Loading…</div></div>
  <div class="sync" id="sync"></div>
</div>

<div class="modal" id="logm">
  <div class="mbox">
    <div class="ph">Log a call or note</div>
    <div class="pb">
      <div class="mrow">
        <div><label>Type</label><select id="l-kind"><option value="call">📞 Phone call</option><option value="text">💬 Text</option><option value="email">✉️ Email</option><option value="note">📝 Note</option></select></div>
        <div><label>Direction</label><select id="l-dir"><option value="in">They contacted us</option><option value="out">We contacted them</option></select></div>
      </div>
      <div><label>Customer / vendor</label><input type="text" id="l-who" placeholder="Name or company" list="names"><datalist id="names"></datalist></div>
      <div class="mrow">
        <div><label>Phone</label><input type="text" id="l-phone" placeholder="904-…"></div>
        <div><label>Ref (INV / Q / PO)</label><input type="text" id="l-ref" placeholder="INV-01320"></div>
      </div>
      <div><label>What happened</label><textarea id="l-sum" placeholder="Asked about lead time on the double door; said he'd confirm hand by Friday"></textarea></div>
      <label style="display:flex;align-items:center;gap:6px;text-transform:none;font-size:13px;font-weight:600;color:#1a2438"><input type="checkbox" id="l-needs"> Needs a follow-up from us</label>
      <div class="mrow" style="margin-top:4px">
        <button class="btn btn-gh" onclick="closeLog()">Cancel</button>
        <button class="btn btn-p" onclick="saveLog()">Save</button>
      </div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
// ── Firestore REST (same project as the tool) ────────────────────────────────
var KEY = "AIzaSyAf50oc1i0ec1hsD_pPQNjj_tqcpIt0Sig";
var BASE = "https://firestore.googleapis.com/v1/projects/norwood-supply/databases/(default)/documents";
var $ = function(id){ return document.getElementById(id); };

function fv(v){ // Firestore value -> JS
  if (v == null) return null;
  if ('stringValue' in v) return v.stringValue;
  if ('integerValue' in v) return Number(v.integerValue);
  if ('doubleValue' in v) return v.doubleValue;
  if ('booleanValue' in v) return v.booleanValue;
  if ('nullValue' in v) return null;
  if ('timestampValue' in v) return v.timestampValue;
  if ('mapValue' in v) { var o = {}; var f = v.mapValue.fields || {}; for (var k in f) o[k] = fv(f[k]); return o; }
  if ('arrayValue' in v) return (v.arrayValue.values || []).map(fv);
  return null;
}
function tv(x){ // JS -> Firestore value
  if (x === null || x === undefined) return { nullValue: null };
  if (typeof x === 'string') return { stringValue: x };
  if (typeof x === 'boolean') return { booleanValue: x };
  if (typeof x === 'number') return Number.isInteger(x) ? { integerValue: String(x) } : { doubleValue: x };
  if (Array.isArray(x)) return { arrayValue: { values: x.map(tv) } };
  var f = {}; for (var k in x) f[k] = tv(x[k]); return { mapValue: { fields: f } };
}
function docToObj(d){ var o = {}; var f = d.fields || {}; for (var k in f) o[k] = fv(f[k]); o._id = d.name.split('/').pop(); return o; }

async function runQuery(coll, field, since, limit){
  var q = { structuredQuery: { from: [{ collectionId: coll }], limit: limit || 1500 } };
  if (field) { q.structuredQuery.where = { fieldFilter: { field: { fieldPath: field }, op: 'GREATER_THAN_OR_EQUAL', value: tv(since) } }; q.structuredQuery.orderBy = [{ field: { fieldPath: field }, direction: 'DESCENDING' }]; }
  var r = await fetch(BASE + ':runQuery?key=' + KEY, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(q) });
  var j = await r.json();
  return (j || []).filter(function(x){ return x.document; }).map(function(x){ return docToObj(x.document); });
}
async function getDoc(path){ var r = await fetch(BASE + '/' + path + '?key=' + KEY); if (!r.ok) return null; return docToObj(await r.json()); }
async function patchDoc(path, obj, mask){
  var url = BASE + '/' + path + '?key=' + KEY + (mask || []).map(function(m){ return '&updateMask.fieldPaths=' + encodeURIComponent(m); }).join('');
  var f = {}; for (var k in obj) f[k] = tv(obj[k]);
  var r = await fetch(url, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ fields: f }) });
  if (!r.ok) throw new Error('write failed ' + r.status);
  return r.json();
}

// ── State ────────────────────────────────────────────────────────────────────
var range = localStorage.getItem('ns_act_range') || 'today';
var filter = 'all';
var EVENTS = [], NEEDS = [], DISMISS = {}, NAMES = {};
var who = localStorage.getItem('ns_inv_actingAs') || '';
$('who').value = who;
$('who').onchange = function(){ who = this.value; localStorage.setItem('ns_inv_actingAs', who); };

function bounds(){
  var now = new Date(), s = new Date(now); s.setHours(0,0,0,0);
  var e = new Date(s); e.setDate(e.getDate() + 1);
  if (range === 'yesterday') { s.setDate(s.getDate() - 1); e = new Date(s); e.setDate(e.getDate() + 1); }
  else if (range === 'week') { var d = s.getDay(); s.setDate(s.getDate() - (d === 0 ? 6 : d - 1)); e = new Date(now.getTime() + 60000); }
  else if (range === '7d') { s.setDate(s.getDate() - 6); e = new Date(now.getTime() + 60000); }
  return { s: s.getTime(), e: e.getTime() };
}
function money(n){ return '$' + (Math.round((+n || 0) * 100) / 100).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function tstr(ms){ var d = new Date(ms); return d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }); }
function dstr(ms){ var d = new Date(ms); return d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }); }
function ago(ms){ var h = (Date.now() - ms) / 36e5; if (h < 1) return Math.round(h * 60) + ' min ago'; if (h < 36) return Math.round(h) + ' hr ago'; return Math.round(h / 24) + ' days ago'; }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function key(s){ return String(s || '').trim().toLowerCase().replace(/\s+/g, ' '); }
function telHref(p){ return p ? 'tel:' + String(p).replace(/[^\d+]/g, '') : ''; }
function smsHref(p){ return p ? 'sms:' + String(p).replace(/[^\d+]/g, '') : ''; }
function toast(m, c){ var t = $('toast'); t.textContent = m; t.style.background = c || '#1a2438'; t.style.display = 'block'; setTimeout(function(){ t.style.display = 'none'; }, 2600); }

// ── Load everything ──────────────────────────────────────────────────────────
async function load(){
  var b = bounds();
  $('timeline').innerHTML = '<div class="empty">Loading…</div>';
  $('sync').textContent = '';
  try {
    var since14 = Date.now() - 14 * 864e5;
    var res = await Promise.all([
      runQuery('ns_activity', 'at', Math.min(b.s, since14)),
      runQuery('ns_quotes', 'timestamp', Math.min(b.s, since14)),
      getDoc('ns_sync/ns_po_log'),
      getDoc('ns_sync/ns_activity_meta')
    ]);
    var acts = res[0], quotes = res[1].filter(function(q){ return !q.removed; }), polog = (res[2] && res[2].data) || [], meta = res[3];
    DISMISS = (meta && meta.data) || {};
    build(acts, quotes, polog, b);
    render();
    $('sync').textContent = 'Updated ' + new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }) + ' · ' + acts.length + ' messages · ' + quotes.length + ' quotes/invoices · ' + polog.length + ' POs read';
  } catch (e) {
    $('timeline').innerHTML = '<div class="empty">Could not load: ' + esc(e.message) + '</div>';
  }
}

function build(acts, quotes, polog, b){
  EVENTS = []; NEEDS = []; NAMES = {};
  var inRange = function(ms){ return ms >= b.s && ms < b.e; };
  var addName = function(n, o){ if (!n) return; var k = key(n); if (!NAMES[k]) NAMES[k] = { name: n.trim(), phone: '', email: '', refs: {} }; if (o) { if (o.phone && !NAMES[k].phone) NAMES[k].phone = o.phone; if (o.email && !NAMES[k].email) NAMES[k].email = o.email; if (o.ref) NAMES[k].refs[o.ref] = 1; } };

  // 1. Messages (emails / texts / marketplace / manual logs)
  acts.forEach(function(a){
    var nm = a.who || a.contact && (a.contact.email || a.contact.phone) || 'Unknown';
    addName(nm, { phone: a.contact && a.contact.phone, email: a.contact && a.contact.email, ref: a.ref });
    if (inRange(a.at)) EVENTS.push({ at: a.at, kind: a.kind || 'note', dir: a.dir || 'in', who: nm, party: a.party || 'customer', title: a.subject || '', sub: a.summary || '', link: a.link || '', ref: a.ref || '', id: a._id, needs: !!a.needsReply && !a.done, source: a.source || '' });
    if (a.needsReply && !a.done) NEEDS.push({ k: 'act:' + a._id, tag: 'reply', cls: 'reply', at: a.at, who: nm, title: (a.kind === 'text' ? 'Text' : a.kind === 'marketplace' ? 'Marketplace message' : a.kind === 'email' ? 'Email' : 'Message') + ' waiting on a reply', sub: (a.subject ? a.subject + ' — ' : '') + (a.summary || ''), link: a.link, phone: a.contact && a.contact.phone, email: a.contact && a.contact.email, ref: a.ref, actDoc: a._id });
  });

  // 2. Quotes / invoices / payments / releases from the tool
  quotes.forEach(function(q){
    var c = q.customer || {}; var nm = c.name || c.co || 'Walk-in';
    addName(nm, { phone: c.phone, email: c.email, ref: q.quoteNum });
    var created = Number(q.id) || q.timestamp;
    var isInv = q.type === 'invoice' || /^INV/.test(q.quoteNum || '');
    var pushEv = function(at, title, sub, extra){ if (inRange(at)) EVENTS.push(Object.assign({ at: at, kind: 'tool', dir: 'out', who: nm, party: 'customer', title: title, sub: sub || '', ref: q.quoteNum, rep: q.rep || c.rep || '' }, extra || {})); };
    if (!q.fromQuoteNum || !isInv) pushEv(created, (isInv ? 'Invoice ' : 'Quote ') + q.quoteNum + ' created', money(q.grand) + (q.rep || c.rep ? ' · ' + (q.rep || c.rep) : ''));
    if (q.invoicedAt) pushEv(q.invoicedAt, 'Invoice ' + q.quoteNum + ' made from ' + (q.fromQuoteNum || 'quote'), money(q.grand) + (q.invoicedBy ? ' · by ' + q.invoicedBy : ''));
    (q.paymentHistory || []).forEach(function(p){ if (p.timestamp) pushEv(p.timestamp, 'Payment ' + money(p.amount) + ' on ' + q.quoteNum, (p.method || '') + (p.type === 'deposit' || (q.balanceDue > 0.5) ? ' · deposit, still owes ' + money(q.balanceDue) : ' · paid in full'), { money: +p.amount || 0 }); });
    if (q.release && q.release.at) pushEv(q.release.at, 'Released ' + q.quoteNum + ' to ' + (q.release.pickedUpBy || ''), 'by ' + (q.release.by || '') + (q.release.balance > 0.5 ? ' · OWING ' + money(q.release.balance) : ' · paid'));
    (q.history || []).forEach(function(h){ if (h.at && !/invoiced|released/.test(h.action || '')) pushEv(h.at, q.quoteNum + ': ' + (h.action || ''), h.by ? 'by ' + h.by : ''); });

    // Needs action — quotes going stale, released owing
    var ageH = (Date.now() - created) / 36e5;
    if (!isInv && ageH > 24 && ageH < 14 * 24 && !DISMISS['q:' + q.quoteNum]) NEEDS.push({ k: 'q:' + q.quoteNum, tag: 'quote follow-up', cls: 'quote', at: created, who: nm, title: q.quoteNum + ' sent ' + ago(created) + ' — no invoice yet', sub: money(q.grand) + (q.rep || c.rep ? ' · ' + (q.rep || c.rep) : '') + ' · check in, offer to lock in pricing', phone: c.phone, email: c.email, ref: q.quoteNum, toolLink: 'index.html' });
    if (q.release && q.release.at && q.balanceDue > 0.5 && !DISMISS['rel:' + q.quoteNum]) NEEDS.push({ k: 'rel:' + q.quoteNum, tag: 'released owing', cls: 'owing', at: q.release.at, who: nm, title: q.quoteNum + ' released but still owes ' + money(q.balanceDue), sub: 'Released ' + ago(q.release.at) + ' to ' + (q.release.pickedUpBy || '') + ' by ' + (q.release.by || '') + (q.release.reason ? ' — ' + q.release.reason : ''), phone: c.phone, email: c.email, ref: q.quoteNum, toolLink: 'index.html?pay=' + q.quoteNum });
  });

  // 3. Purchase orders to vendors
  polog.forEach(function(p){
    var at = p.savedAt ? Date.parse(p.savedAt) : Number(p.id); if (!at) return;
    addName(p.vendorName, { email: p.vendorEmail, ref: p.poNum });
    if (inRange(at)) EVENTS.push({ at: at, kind: 'vendor', dir: 'out', who: p.vendorName || 'Vendor', party: 'vendor', title: p.poNum + ' → ' + (p.vendorName || '') + ' for ' + (p.customerName || ''), sub: '$' + (p.totalCost || '0') + ' cost · ' + (p.status || '') + (p.refInv ? ' · ' + p.refInv : ''), ref: p.poNum, email: p.vendorEmail });
    var ageH = (Date.now() - at) / 36e5;
    var st = String(p.status || '').toLowerCase();
    if (ageH > 24 && ageH < 21 * 24 && !p.ack && !/received|complete|cancel/.test(st) && !DISMISS['po:' + p.poNum]) NEEDS.push({ k: 'po:' + p.poNum, tag: 'vendor', cls: 'vendor', at: at, who: p.vendorName || 'Vendor', title: p.poNum + ' — no confirmation from ' + (p.vendorName || 'vendor') + ' (' + ago(at) + ')', sub: 'For ' + (p.customerName || '') + ' · $' + (p.totalCost || '0') + (p.reqBy ? ' · needed by ' + p.reqBy : ''), email: p.vendorEmail, ref: p.poNum, po: true });
  });

  EVENTS.sort(function(a, b){ return b.at - a.at; });
  NEEDS.sort(function(a, b){ var o = { owing: 0, reply: 1, vendor: 2, quote: 3 }; return (o[a.cls] - o[b.cls]) || (b.at - a.at); });
  var dl = $('names'); dl.innerHTML = Object.keys(NAMES).sort().map(function(k){ return '<option value="' + esc(NAMES[k].name) + '">'; }).join('');
}

// ── Render ───────────────────────────────────────────────────────────────────
function render(){
  var b = bounds();
  // KPIs
  var n = { email: 0, text: 0, marketplace: 0, quotes: 0, invoices: 0, paid: 0, pos: 0, calls: 0 };
  EVENTS.forEach(function(e){
    if (e.kind === 'email') n.email++; else if (e.kind === 'text') n.text++; else if (e.kind === 'marketplace') n.marketplace++;
    else if (e.kind === 'call' || e.kind === 'note') n.calls++; else if (e.kind === 'vendor') n.pos++;
    else if (e.kind === 'tool') { if (/^Quote .* created/.test(e.title)) n.quotes++; if (/^Invoice /.test(e.title)) n.invoices++; if (e.money) n.paid += e.money; }
  });
  $('kpis').innerHTML = [
    ['✉️ ' + n.email, 'Emails'], ['💬 ' + n.text, 'Texts'], ['🛒 ' + n.marketplace, 'Marketplace'], ['📞 ' + n.calls, 'Calls / notes'],
    ['📋 ' + n.quotes, 'Quotes'], ['🧾 ' + n.invoices, 'Invoices'], ['🏭 ' + n.pos, 'POs out'], [money(n.paid), 'Collected', 'money']
  ].map(function(k){ return '<div class="kpi ' + (k[2] || '') + '"><div class="n">' + k[0] + '</div><div class="l">' + k[1] + '</div></div>'; }).join('');

  // Needs action
  $('needs-count').textContent = NEEDS.length ? NEEDS.length + ' open' : 'nothing waiting';
  var SECT = [['owing', '💰 Product released, still owed', true], ['reply', '💬 Messages waiting on a reply', true], ['vendor', '🏭 Vendors who haven\'t confirmed a PO', false], ['quote', '📋 Quotes to follow up (1–14 days old)', false]];
  var openSect = {}; try { openSect = JSON.parse(localStorage.getItem('ns_act_sect') || '{}'); } catch (e) {}
  var needHtml = function(x){
    var acts = [];
    if (x.toolLink) acts.push('<a href="' + x.toolLink + '">' + (x.cls === 'owing' ? '💰 Take payment' : '🧾 Open in tool') + '</a>');
    if (x.link) acts.push('<a href="' + esc(x.link) + '" target="_blank">✉️ Open message</a>');
    if (x.email) acts.push('<a href="mailto:' + esc(x.email) + (x.ref ? '?subject=' + encodeURIComponent('Norwood Supply — ' + x.ref) : '') + '">✉️ Email</a>');
    if (x.phone) { acts.push('<a href="' + telHref(x.phone) + '">📞 Call</a>'); acts.push('<a href="' + smsHref(x.phone) + '">💬 Text</a>'); }
    acts.push('<button onclick="logFor(' + JSON.stringify(x.who).replace(/"/g, '&quot;') + ',' + JSON.stringify(x.phone || '').replace(/"/g, '&quot;') + ',' + JSON.stringify(x.ref || '').replace(/"/g, '&quot;') + ')">＋ Log</button>');
    acts.push('<button class="done" onclick="markDone(\'' + x.k + '\')">✓ Done</button>');
    return '<div class="act"><span class="tag ' + x.cls + '">' + x.tag + '</span><div class="body"><div class="t">' + esc(x.who) + ' <span class="age">' + esc(x.title) + '</span></div><div class="s">' + esc(x.sub) + '</div><div class="acts">' + acts.join('') + '</div></div></div>';
  };
  $('needs').innerHTML = NEEDS.length ? SECT.map(function(s){
    var items = NEEDS.filter(function(x){ return x.cls === s[0]; }); if (!items.length) return '';
    var open = (s[0] in openSect) ? openSect[s[0]] : s[2];
    return '<details class="nsect" data-s="' + s[0] + '"' + (open ? ' open' : '') + '><summary>' + s[1] + ' <span class="cnt">' + items.length + '</span></summary>' + items.map(needHtml).join('') + '</details>';
  }).join('') : '<div class="empty">✅ Nothing waiting on you.</div>';
  document.querySelectorAll('.nsect').forEach(function(d){ d.ontoggle = function(){ openSect[d.dataset.s] = d.open; try { localStorage.setItem('ns_act_sect', JSON.stringify(openSect)); } catch (e) {} }; });

  // Timeline grouped by person
  var s = key($('search').value);
  var evs = EVENTS.filter(function(e){
    if (filter !== 'all') { if (filter === 'call') { if (e.kind !== 'call' && e.kind !== 'note') return false; } else if (e.kind !== filter) return false; }
    if (s && key(e.who + ' ' + e.title + ' ' + e.sub + ' ' + e.ref).indexOf(s) < 0) return false;
    return true;
  });
  if (!evs.length) { $('timeline').innerHTML = '<div class="empty">No activity ' + ({ today: 'today', yesterday: 'yesterday', week: 'this week', '7d': 'in the last 7 days' })[range] + (filter !== 'all' || s ? ' matching that filter' : '') + '.</div>'; return; }
  var groups = {}, order = [];
  evs.forEach(function(e){ var k = key(e.who); if (!groups[k]) { groups[k] = { who: e.who, party: e.party, evs: [], kinds: {}, needs: 0 }; order.push(k); } groups[k].evs.push(e); groups[k].kinds[e.kind] = (groups[k].kinds[e.kind] || 0) + 1; if (e.needs) groups[k].needs++; });
  var multiDay = range !== 'today' && range !== 'yesterday';
  $('timeline').innerHTML = order.map(function(k){
    var g = groups[k], nm = NAMES[k] || {};
    var chips = Object.keys(g.kinds).map(function(kd){ return '<span class="chip ' + kd + '">' + ({ email: '✉️', text: '💬', marketplace: '🛒', tool: '🧾', vendor: '🏭', call: '📞', note: '📝' })[kd] + ' ' + g.kinds[kd] + '</span>'; }).join('');
    if (g.needs) chips = '<span class="chip alert">⚠️ ' + g.needs + ' waiting</span>' + chips;
    var rk = Object.keys(nm.refs || {}); var refs = rk.slice(0, 4).join(', ') + (rk.length > 4 ? ' +' + (rk.length - 4) + ' more' : '');
    var contact = [nm.phone ? '<a class="lnk" href="' + telHref(nm.phone) + '">📞 ' + esc(nm.phone) + '</a>' : '', nm.email ? '<a class="lnk" href="mailto:' + esc(nm.email) + '">✉️ ' + esc(nm.email) + '</a>' : ''].join('');
    var rows = g.evs.map(function(e){
      var ic = { email: '✉️', text: '💬', marketplace: '🛒', tool: '🧾', vendor: '🏭', call: '📞', note: '📝' }[e.kind] || '•';
      var link = e.link ? '<a class="lnk" href="' + esc(e.link) + '" target="_blank">open ↗</a>' : '';
      var dir = (e.kind === 'email' || e.kind === 'text' || e.kind === 'marketplace' || e.kind === 'call') ? '<span class="dir ' + e.dir + '">' + (e.dir === 'in' ? 'IN' : 'OUT') + '</span>' : '';
      return '<div class="ev' + (e.needs ? ' needs' : '') + '"><div class="ic">' + ic + '</div><div class="time">' + (multiDay ? dstr(e.at) + '<br>' : '') + tstr(e.at) + '</div><div class="txt">' + dir + '<b>' + esc(e.title || (e.kind + ' message')) + '</b>' + link + (e.needs ? ' <span class="chip alert">needs reply</span>' : '') + (e.sub ? '<div class="sub">' + esc(e.sub) + '</div>' : '') + '</div></div>';
    }).join('');
    return '<details class="grp" open><summary><span class="who">' + esc(g.who) + (refs ? '<small>' + esc(refs) + '</small>' : '') + '</span>' + contact + '<span class="chips">' + chips + '</span></summary>' + rows + '</details>';
  }).join('');
}

// ── Actions ──────────────────────────────────────────────────────────────────
async function markDone(k){
  if (!who) { toast('Pick "Acting as" first', '#c04040'); $('who').focus(); return; }
  try {
    if (k.indexOf('act:') === 0) {
      await patchDoc('ns_activity/' + k.slice(4), { done: true, doneBy: who, doneAt: Date.now() }, ['done', 'doneBy', 'doneAt']);
    } else {
      var f = {}; f[k] = { done: true, by: who, at: Date.now() };
      await patchDoc('ns_sync/ns_activity_meta', { data: f }, ['data.`' + k + '`']);
      DISMISS[k] = f[k];
    }
    NEEDS = NEEDS.filter(function(x){ return x.k !== k; });
    EVENTS.forEach(function(e){ if ('act:' + e.id === k) e.needs = false; });
    render(); toast('✓ Marked done by ' + who, '#2d6a30');
  } catch (e) { toast('Could not save: ' + e.message, '#c04040'); }
}
function openLog(){ $('logm').classList.add('on'); setTimeout(function(){ $('l-who').focus(); }, 50); }
function closeLog(){ $('logm').classList.remove('on'); }
function logFor(nm, phone, ref){ $('l-who').value = nm || ''; $('l-phone').value = phone || ''; $('l-ref').value = ref || ''; $('l-kind').value = 'call'; openLog(); }
async function saveLog(){
  if (!who) { toast('Pick "Acting as" first', '#c04040'); $('who').focus(); return; }
  var nm = $('l-who').value.trim(), sum = $('l-sum').value.trim();
  if (!nm || !sum) { toast('Need a name and what happened', '#c04040'); return; }
  var known = NAMES[key(nm)] || {};
  var at = Date.now();
  var doc = { kind: $('l-kind').value, dir: $('l-dir').value, who: nm, party: /tlc|dyke|bluelinx|logan|woodgrain|mastercraft|sbp|wbp|yella/i.test(nm) ? 'vendor' : 'customer', contact: { phone: $('l-phone').value.trim() || known.phone || '', email: known.email || '' }, subject: '', summary: sum, at: at, link: '', ref: $('l-ref').value.trim(), needsReply: $('l-needs').checked, done: false, source: 'manual', by: who };
  try {
    await patchDoc('ns_activity/' + at, doc);
    closeLog(); $('l-sum').value = ''; $('l-needs').checked = false;
    toast('Logged', '#2d6a30'); load();
  } catch (e) { toast('Could not save: ' + e.message, '#c04040'); }
}

// ── Wiring ───────────────────────────────────────────────────────────────────
document.querySelectorAll('#range button').forEach(function(b){ if (b.dataset.r === range) { document.querySelector('#range .on').classList.remove('on'); b.classList.add('on'); } b.onclick = function(){ document.querySelector('#range .on').classList.remove('on'); b.classList.add('on'); range = b.dataset.r; localStorage.setItem('ns_act_range', range); load(); }; });
document.querySelectorAll('.pill').forEach(function(p){ p.onclick = function(){ document.querySelector('.pill.on').classList.remove('on'); p.classList.add('on'); filter = p.dataset.f; render(); }; });
$('search').oninput = function(){ render(); };
$('logm').onclick = function(e){ if (e.target === this) closeLog(); };
load();
setInterval(load, 5 * 60 * 1000);
</script>
