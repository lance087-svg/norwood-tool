<!-- ============================================================
  NORWOOD SUPPLY — BARCODE SCANNER PATCH
  Paste this entire block just before </body> in inventory.html
  Requires: Firebase already initialized as "norwood-inv" app
  Library: ZXing (loaded from CDN below — no install needed)
  ============================================================ -->

<!-- ZXing barcode library -->
<script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script>

<!-- Scanner overlay UI -->
<div id="nw-scanner-overlay" style="display:none; position:fixed; inset:0; z-index:9999;
  background:#000; flex-direction:column; align-items:center; justify-content:flex-start;">

  <!-- Header bar -->
  <div style="width:100%; display:flex; align-items:center; justify-content:space-between;
    padding:14px 18px; background:#1E70B8; box-sizing:border-box;">
    <span style="color:#fff; font-family:Arial,sans-serif; font-size:18px; font-weight:700;">
      📷 Scan Item
    </span>
    <button id="nw-scan-close" style="background:rgba(255,255,255,0.2); border:none; color:#fff;
      font-size:22px; width:36px; height:36px; border-radius:50%; cursor:pointer; line-height:1;">
      ✕
    </button>
  </div>

  <!-- Camera viewfinder -->
  <div style="position:relative; width:100%; max-width:480px; margin-top:8px;">
    <video id="nw-scan-video" style="width:100%; display:block; background:#111;"
      playsinline autoplay muted></video>

    <!-- Targeting reticle overlay -->
    <div style="position:absolute; inset:0; pointer-events:none; display:flex;
      align-items:center; justify-content:center;">
      <div style="width:72%; height:30%; border:3px solid #1E70B8; border-radius:8px;
        box-shadow:0 0 0 4000px rgba(0,0,0,0.45);">
        <!-- corner accents -->
        <div style="position:absolute; top:-3px; left:-3px; width:20px; height:20px;
          border-top:4px solid #fff; border-left:4px solid #fff; border-radius:4px 0 0 0;"></div>
        <div style="position:absolute; top:-3px; right:-3px; width:20px; height:20px;
          border-top:4px solid #fff; border-right:4px solid #fff; border-radius:0 4px 0 0;"></div>
        <div style="position:absolute; bottom:-3px; left:-3px; width:20px; height:20px;
          border-bottom:4px solid #fff; border-left:4px solid #fff; border-radius:0 0 0 4px;"></div>
        <div style="position:absolute; bottom:-3px; right:-3px; width:20px; height:20px;
          border-bottom:4px solid #fff; border-right:4px solid #fff; border-radius:0 0 4px 0;"></div>
      </div>
    </div>
  </div>

  <!-- Status message -->
  <p id="nw-scan-status" style="color:#aaa; font-family:Arial,sans-serif; font-size:14px;
    margin:12px 0 4px; text-align:center; padding:0 20px;">
    Point at a Norwood barcode label
  </p>

  <!-- Result card (hidden until scan) -->
  <div id="nw-scan-result" style="display:none; width:calc(100% - 32px); max-width:448px;
    background:#1a1a2e; border:1px solid #1E70B8; border-radius:10px;
    padding:16px; margin-top:8px; box-sizing:border-box;">

    <div style="display:flex; gap:14px; align-items:flex-start;">
      <img id="nw-result-photo" src="" alt=""
        style="width:80px; height:80px; object-fit:cover; border-radius:6px;
          background:#333; display:none; flex-shrink:0;">
      <div id="nw-result-no-photo" style="width:80px; height:80px; border-radius:6px;
        background:#2a2a3e; display:flex; align-items:center; justify-content:center;
        flex-shrink:0; font-size:28px; color:#555;">🚪</div>

      <div style="flex:1; min-width:0;">
        <div id="nw-result-badge" style="display:none; font-size:10px; font-weight:700;
          background:#e65100; color:#fff; padding:2px 7px; border-radius:3px;
          display:inline-block; margin-bottom:5px;">SALVAGE</div>
        <div id="nw-result-sku" style="color:#1E70B8; font-family:monospace; font-size:12px;
          margin-bottom:4px;"></div>
        <div id="nw-result-desc" style="color:#fff; font-family:Arial,sans-serif;
          font-size:15px; font-weight:600; line-height:1.3; word-wrap:break-word;"></div>
      </div>
    </div>

    <div style="display:flex; gap:10px; margin-top:12px; flex-wrap:wrap;">
      <div style="flex:1; min-width:100px; background:#0d1117; border-radius:6px;
        padding:10px; text-align:center;">
        <div style="color:#888; font-size:10px; font-family:Arial,sans-serif;
          text-transform:uppercase; letter-spacing:.5px;">Retail Price</div>
        <div id="nw-result-price" style="color:#4caf50; font-size:20px; font-weight:700;
          font-family:Arial,sans-serif; margin-top:3px;"></div>
      </div>
      <div style="flex:1; min-width:100px; background:#0d1117; border-radius:6px;
        padding:10px; text-align:center;">
        <div style="color:#888; font-size:10px; font-family:Arial,sans-serif;
          text-transform:uppercase; letter-spacing:.5px;">In Stock</div>
        <div id="nw-result-qoh" style="color:#fff; font-size:20px; font-weight:700;
          font-family:Arial,sans-serif; margin-top:3px;"></div>
      </div>
    </div>

    <div style="display:flex; gap:8px; margin-top:12px;">
      <button id="nw-result-scan-again" style="flex:1; background:#1E70B8; border:none;
        color:#fff; font-size:14px; font-weight:600; padding:11px; border-radius:7px;
        cursor:pointer; font-family:Arial,sans-serif;">
        Scan Another
      </button>
      <button id="nw-result-close" style="flex:1; background:#2a2a3e; border:none;
        color:#aaa; font-size:14px; padding:11px; border-radius:7px; cursor:pointer;
        font-family:Arial,sans-serif;">
        Close
      </button>
    </div>
  </div>

  <!-- Error message -->
  <div id="nw-scan-error" style="display:none; width:calc(100% - 32px); max-width:448px;
    background:#3a1a1a; border:1px solid #c0392b; border-radius:10px;
    padding:16px; margin-top:8px; text-align:center; box-sizing:border-box;">
    <div id="nw-error-msg" style="color:#e74c3c; font-family:Arial,sans-serif;
      font-size:14px; margin-bottom:12px;"></div>
    <button id="nw-error-retry" style="background:#c0392b; border:none; color:#fff;
      font-size:14px; padding:10px 24px; border-radius:7px; cursor:pointer;
      font-family:Arial,sans-serif;">Try Again</button>
  </div>

</div>

<!-- Scan trigger button — injects itself into existing toolbar -->
<script>
(function() {
  'use strict';

  // ── Config ──────────────────────────────────────────────────────────────
  const FIREBASE_APP_NAME = 'norwood-inv';   // matches your named Firebase app
  const COLLECTION        = 'norwood';       // Firestore collection name
  const ITEM_ID_FIELD     = 'itemNumber';    // field storing the barcode / item #
  // ────────────────────────────────────────────────────────────────────────

  let codeReader  = null;
  let scanActive  = false;
  let videoStream = null;

  // ── Inject Scan button into the toolbar ──────────────────────────────────
  // Waits for DOM to be ready, then looks for the first toolbar/tab bar area.
  // Adjust the selector below if your toolbar has a different id/class.
  function injectScanButton() {
    // Try common toolbar targets; falls back to a floating button
    const toolbarSelectors = [
      '#toolbar',
      '.toolbar',
      '#tab-bar',
      '.tab-bar',
      '#action-bar',
      'nav',
      'header'
    ];

    let toolbar = null;
    for (const sel of toolbarSelectors) {
      toolbar = document.querySelector(sel);
      if (toolbar) break;
    }

    const btn = document.createElement('button');
    btn.id = 'nw-scan-open-btn';
    btn.innerHTML = '📷 Scan';
    btn.title = 'Scan barcode label';

    if (toolbar) {
      // Match existing button style if possible
      const existingBtn = toolbar.querySelector('button');
      if (existingBtn) {
        btn.className = existingBtn.className;
      }
      btn.style.cssText = `
        cursor:pointer; font-size:14px; font-weight:600;
        padding:8px 14px; border-radius:6px; border:none;
        background:#1E70B8; color:#fff; margin-left:8px;
        white-space:nowrap; display:inline-flex; align-items:center; gap:6px;
      `;
      toolbar.appendChild(btn);
    } else {
      // Floating button fallback (bottom-right corner)
      btn.style.cssText = `
        position:fixed; bottom:20px; right:20px; z-index:9990;
        background:#1E70B8; color:#fff; border:none; border-radius:50px;
        padding:14px 20px; font-size:16px; font-weight:700; cursor:pointer;
        box-shadow:0 4px 16px rgba(0,0,0,0.4); white-space:nowrap;
      `;
      document.body.appendChild(btn);
    }

    btn.addEventListener('click', openScanner);
  }

  // ── Scanner open/close ───────────────────────────────────────────────────
  function openScanner() {
    const overlay = document.getElementById('nw-scanner-overlay');
    overlay.style.display = 'flex';
    resetResultUI();
    startCamera();
  }

  function closeScanner() {
    stopCamera();
    document.getElementById('nw-scanner-overlay').style.display = 'none';
  }

  function startCamera() {
    const video = document.getElementById('nw-scan-video');
    setStatus('Point at a Norwood barcode label', '#aaa');

    try {
      const ZXing = window.ZXing || window['@zxing/library'];
      if (!ZXing) { setError('ZXing library not loaded. Check internet connection.'); return; }

      codeReader = new ZXing.BrowserMultiFormatReader();
      scanActive = true;

      codeReader.decodeFromConstraints(
        { video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } } },
        video,
        (result, err) => {
          if (!scanActive) return;
          if (result) {
            const barcode = result.getText().trim();
            console.log('Scanned:', barcode);
            setStatus('✅ Found: ' + barcode, '#4caf50');
            scanActive = false;
            lookupItem(barcode);
          }
          // Ignore continuous decode errors (normal during scanning)
        }
      ).catch(e => {
        setError('Camera error: ' + (e.message || e));
      });

    } catch (e) {
      setError('Scanner init error: ' + (e.message || e));
    }
  }

  function stopCamera() {
    scanActive = false;
    if (codeReader) {
      try { codeReader.reset(); } catch(_) {}
      codeReader = null;
    }
    const video = document.getElementById('nw-scan-video');
    if (video && video.srcObject) {
      video.srcObject.getTracks().forEach(t => t.stop());
      video.srcObject = null;
    }
  }

  // ── Firestore lookup ─────────────────────────────────────────────────────
  function lookupItem(barcode) {
    setStatus('🔍 Looking up item…', '#aaa');

    // Get the named Firebase app and its Firestore instance
    let db;
    try {
      const app = firebase.app(FIREBASE_APP_NAME);
      db = firebase.firestore(app);
    } catch (e) {
      // Fall back to default app if named app isn't found
      try {
        db = firebase.firestore();
      } catch (e2) {
        setError('Firebase not available. Make sure inventory.html is open.');
        return;
      }
    }

    // Query by itemNumber field (exact match)
    db.collection(COLLECTION)
      .where(ITEM_ID_FIELD, '==', barcode)
      .limit(1)
      .get()
      .then(snapshot => {
        if (snapshot.empty) {
          // Also try querying as document ID directly
          return db.collection(COLLECTION).doc(barcode).get()
            .then(doc => {
              if (doc.exists) {
                showResult(barcode, doc.data());
              } else {
                setError('Item <strong>' + escHtml(barcode) + '</strong> not found in inventory.<br>Check that the label matches an item number.');
              }
            });
        }
        const doc = snapshot.docs[0];
        showResult(barcode, doc.data());
      })
      .catch(err => {
        setError('Firestore error: ' + err.message);
      });
  }

  // ── Show result card ──────────────────────────────────────────────────────
  function showResult(barcode, data) {
    stopCamera(); // Stop scanning once we have a hit

    const panel = document.getElementById('nw-scan-result');

    // SKU / item number
    document.getElementById('nw-result-sku').textContent = data.itemNumber || barcode;

    // Description
    const desc = data.description || data.desc || data.name || data.itemDescription || '(No description)';
    document.getElementById('nw-result-desc').textContent = desc;

    // Price
    const price = data.retailPrice || data.price || data.retail || 0;
    document.getElementById('nw-result-price').textContent =
      price ? '$' + parseFloat(price).toFixed(2) : '—';

    // QOH
    const qoh = data.qoh !== undefined ? data.qoh : (data.quantity !== undefined ? data.quantity : '—');
    document.getElementById('nw-result-qoh').textContent = qoh;

    // Salvage badge
    const badge = document.getElementById('nw-result-badge');
    if (data.isSalvage || data.salvage || data.type === 'salvage') {
      badge.style.display = 'inline-block';
    } else {
      badge.style.display = 'none';
    }

    // Photo — checks both field name variants (thumbnail and photoBase64)
    const photoSrc = data.photoBase64 || data.thumbnail || data.photo || '';
    const photoEl  = document.getElementById('nw-result-photo');
    const noPhotoEl = document.getElementById('nw-result-no-photo');
    if (photoSrc) {
      photoEl.src = photoSrc.startsWith('data:') ? photoSrc : 'data:image/jpeg;base64,' + photoSrc;
      photoEl.style.display = 'block';
      noPhotoEl.style.display = 'none';
    } else {
      photoEl.style.display = 'none';
      noPhotoEl.style.display = 'flex';
    }

    document.getElementById('nw-scan-status').style.display = 'none';
    document.getElementById('nw-scan-error').style.display = 'none';
    panel.style.display = 'block';
  }

  // ── UI helpers ────────────────────────────────────────────────────────────
  function setStatus(msg, color) {
    const el = document.getElementById('nw-scan-status');
    el.innerHTML = msg;
    el.style.color = color || '#aaa';
    el.style.display = 'block';
    document.getElementById('nw-scan-result').style.display = 'none';
    document.getElementById('nw-scan-error').style.display = 'none';
  }

  function setError(msg) {
    document.getElementById('nw-error-msg').innerHTML = msg;
    document.getElementById('nw-scan-error').style.display = 'block';
    document.getElementById('nw-scan-result').style.display = 'none';
    document.getElementById('nw-scan-status').style.display = 'none';
  }

  function resetResultUI() {
    document.getElementById('nw-scan-result').style.display = 'none';
    document.getElementById('nw-scan-error').style.display = 'none';
    setStatus('Point at a Norwood barcode label', '#aaa');
  }

  function escHtml(str) {
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // ── Wire up buttons ───────────────────────────────────────────────────────
  document.addEventListener('DOMContentLoaded', function() {
    document.getElementById('nw-scan-close').addEventListener('click', closeScanner);
    document.getElementById('nw-result-close').addEventListener('click', closeScanner);
    document.getElementById('nw-error-retry').addEventListener('click', function() {
      resetResultUI();
      startCamera();
      scanActive = true;
    });
    document.getElementById('nw-result-scan-again').addEventListener('click', function() {
      resetResultUI();
      startCamera();
      scanActive = true;
    });

    // Close on backdrop tap (outside result card)
    document.getElementById('nw-scanner-overlay').addEventListener('click', function(e) {
      if (e.target === this) closeScanner();
    });

    // Inject the Scan button
    injectScanButton();
  });

})();
</script>
<!-- ============================================================
  END NORWOOD SCANNER PATCH
  ============================================================ -->
